name: Build Windows EXE

on:
  push:
    branches: [ main ]        # 当推送到 main 分支时触发
  workflow_dispatch:          # 允许手动触发

jobs:
  build:
    runs-on: windows-latest   # 使用 Windows 运行器

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # 根据需要选择版本

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "ConvertTools" main.py
        # 如果程序有图标，可以添加 --icon=app.ico

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogisticsConverter-exe
          path: dist/ConvertTools.exe   # 根据实际生成的文件名调整
